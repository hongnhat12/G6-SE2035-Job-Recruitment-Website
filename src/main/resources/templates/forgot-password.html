<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Forgot Password')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="flex-grow flex items-center justify-center py-20 px-4 bg-gray-50">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        <div class="p-8">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Forgot Password</h2>
                <p class="text-gray-500">Enter your email to create a reset link</p>
            </div>

            <div th:if="${error}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 text-red-700 text-sm">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${message}" class="mb-6 bg-green-50 border-l-4 border-green-500 p-4 text-green-700 text-sm">
                <span th:text="${message}"></span>
            </div>

            <div th:if="${resetLink}" class="mb-6 bg-yellow-50 border-l-4 border-yellow-500 p-4 text-yellow-800 text-sm break-words">
                <p class="font-bold mb-2">Demo/fallback reset link:</p>
                <a th:href="${resetLink}" th:text="${resetLink}" class="underline"></a>
            </div>

            <form th:action="@{/forgot-password}" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </span>
                        <input type="email" name="email" required class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition sm:text-sm" placeholder="example@email.com" autofocus>
                    </div>
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition">
                    Create Reset Link
                </button>
            </form>

            <div class="mt-8 text-center">
                <a th:href="@{/login}" class="font-bold text-teal-600 hover:text-teal-500 text-sm">Back to login</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
