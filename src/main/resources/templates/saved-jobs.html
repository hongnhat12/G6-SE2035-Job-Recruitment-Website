<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Saved Jobs')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container py-5">

    <!-- ═══ PAGE HEADER ════════════════════════════════════ -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-5">
        <div>
            <h1 class="section-title mb-1">
                <i class="fa-solid fa-bookmark text-primary me-2"></i>Saved Jobs
            </h1>
            <p class="text-muted mb-0">
                You have saved
                <strong th:text="${savedJobs.totalElements}">0</strong> job listings
            </p>
        </div>
        <a th:href="@{/jobs}" class="btn btn-outline-primary fw-semibold px-4">
            <i class="fa-solid fa-magnifying-glass me-2"></i>Find More Jobs
        </a>
    </div>

    <!-- ═══ EMPTY STATE ═════════════════════════════════════ -->
    <div th:if="${savedJobs.empty}"
         class="empty-state bg-white rounded-4 border shadow-sm">
        <div class="empty-icon"><i class="fa-regular fa-bookmark"></i></div>
        <h5 class="fw-bold mt-2">No saved jobs yet</h5>
        <p class="text-muted">Click the <i class="fa-regular fa-bookmark text-primary"></i>
            icon on a job detail page to save your favourite listings</p>
        <a th:href="@{/jobs}" class="btn btn-primary px-5 fw-semibold">
            <i class="fa-solid fa-magnifying-glass me-2"></i>Explore Jobs
        </a>
    </div>

    <!-- ═══ SAVED JOB GRID ══════════════════════════════════ -->
    <div class="row g-3" th:unless="${savedJobs.empty}">
        <div th:each="saved : ${savedJobs.content}" class="col-sm-6 col-xl-4">
            <div class="job-card h-100 position-relative">

                <!-- Remove button -->
                <form th:action="@{/my/saved-jobs/{id}/remove(id=${saved.job.jobId})}"
                      method="post" class="position-absolute top-0 end-0 m-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm btn-light border text-danger rounded-circle shadow-sm"
                            style="width:32px;height:32px;padding:0"
                            title="Remove"
                            onclick="return confirm('Remove this saved job?')">
                        <i class="fa-solid fa-xmark fa-sm"></i>
                    </button>
                </form>

                <!-- Job info (clickable) -->
                <a th:href="@{/jobs/{id}(id=${saved.job.jobId})}" class="job-card-link">
                    <div class="d-flex align-items-start gap-3 mb-3">
                        <div class="company-avatar flex-shrink-0">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <div class="min-w-0 pe-4">
                            <h6 class="fw-semibold text-dark mb-1 text-truncate"
                                th:text="${saved.job.title}">Job Title</h6>
                            <p class="small text-muted mb-0 text-truncate"
                               th:text="${saved.job.company?.companyName}">Company</p>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <span class="pill-type"
                              th:text="${saved.job.employmentType != null ? saved.job.employmentType : 'Full-time'}">
                        </span>
                        <span th:if="${saved.job.location}" class="pill-tag">
                            <i class="fa-solid fa-location-dot me-1"></i>
                            <span th:text="${saved.job.location}"></span>
                        </span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="pill-salary">
                            <i class="fa-solid fa-coins me-1"></i>
                            <span th:if="${saved.job.salaryMin != null and saved.job.salaryMax != null}"
                                  th:text="${saved.job.salaryMin.longValue()/1000000 + '–' + saved.job.salaryMax.longValue()/1000000 + 'M'}">
                            </span>
                            <span th:if="${saved.job.salaryMin == null or saved.job.salaryMax == null}">Negotiable</span>
                        </span>
                        <span class="small text-muted">
                            <i class="fa-regular fa-clock me-1"></i>
                            <span th:text="${#temporals.format(saved.savedAt,'dd/MM/yyyy')}"></span>
                        </span>
                    </div>
                </a>

                <!-- Deadline warning -->
                <div th:if="${saved.job.deadline != null}"
                     class="mt-3 pt-3 border-top d-flex align-items-center justify-content-between">
                    <small class="text-warning fw-medium">
                        <i class="fa-regular fa-calendar-xmark me-1"></i>
                        Due: <span th:text="${#temporals.format(saved.job.deadline,'dd/MM/yyyy')}"></span>
                    </small>
                    <a th:href="@{/jobs/{id}(id=${saved.job.jobId})}"
                       class="btn btn-primary btn-sm fw-semibold px-3">
                        Apply
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ PAGINATION ══════════════════════════════════════ -->
    <nav th:if="${totalPages > 1}" aria-label="Pagination" class="mt-4">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/my/saved-jobs(page=${currentPage-1})}">
                    <i class="fa-solid fa-chevron-left fa-xs"></i>
                </a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                class="page-item" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:text="${i+1}"
                   th:href="@{/my/saved-jobs(page=${i})}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                <a class="page-link" th:href="@{/my/saved-jobs(page=${currentPage+1})}">
                    <i class="fa-solid fa-chevron-right fa-xs"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => document.querySelectorAll('.flash-toast').forEach(el =>
        bootstrap.Alert.getOrCreateInstance(el).close()), 4000);
</script>
</body>
</html>
