<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Saved Jobs')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-8">Saved Jobs</h1>

    <div th:if="${savedJobs.empty}" class="text-center py-24 bg-white rounded-2xl border border-gray-100">
        <svg class="w-24 h-24 mx-auto text-gray-200 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
        </svg>
        <p class="text-xl font-semibold text-gray-500">You have not saved any jobs.</p>
        <a th:href="@{/jobs}" class="mt-6 inline-block bg-teal-600 text-white font-bold px-8 py-3 rounded-xl hover:bg-teal-700 transition">Search Jobs</a>
    </div>

    <div th:unless="${savedJobs.empty}">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="saved : ${savedJobs.content}" class="bg-white border border-gray-100 rounded-2xl p-6 hover:shadow-xl transition group flex flex-col">
                <div class="flex items-start justify-between mb-4">
                    <div class="w-14 h-14 bg-gray-50 rounded-xl border border-gray-100 flex items-center justify-center p-2 flex-shrink-0">
                        <img th:src="${saved.job.company != null and saved.job.company.logo != null ? saved.job.company.logo : 'https://via.placeholder.com/100'}" alt="logo" class="max-w-full max-h-full object-contain">
                    </div>
                    <span class="bg-teal-50 text-teal-600 text-xs font-bold px-3 py-1 rounded-full uppercase" th:text="${saved.job.employmentType}">Type</span>
                </div>
                
                <a th:href="@{/jobs/{id}(id=${saved.job.jobId})}">
                    <h3 class="text-lg font-bold text-gray-900 mb-1 group-hover:text-teal-600 transition" th:text="${saved.job.title}">Job Title</h3>
                </a>
                <p class="text-teal-600 font-semibold text-sm mb-4" th:text="${saved.job.company?.companyName}">Company</p>
                
                <div class="flex flex-wrap gap-2 mb-4 mt-auto">
                    <span class="flex items-center text-gray-500 text-sm bg-gray-50 px-3 py-1 rounded-lg" th:text="${saved.job.location}">Location</span>
                    <span class="flex items-center text-green-600 text-sm bg-green-50 px-3 py-1 rounded-lg font-medium"
                          th:text="${(saved.job.salaryMin != null ? (saved.job.salaryMin.longValue() / 1000) : '0') + 'k - ' + (saved.job.salaryMax != null ? (saved.job.salaryMax.longValue() / 1000) : '0') + 'k'}">
                        Salary
                    </span>
                </div>
                
                <div class="flex gap-2 pt-4 border-t border-gray-50">
                    <a th:href="@{/jobs/{id}(id=${saved.job.jobId})}" class="flex-grow text-center bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold py-2 px-4 rounded-xl transition">View Details</a>
                    
                    <form th:action="@{/my/saved-jobs/{id}/remove(id=${saved.job.jobId})}" method="POST" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="text-sm text-red-500 hover:text-red-700 border border-red-200 hover:border-red-400 py-2 px-4 rounded-xl transition">Unsave</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="flex justify-center mt-10 space-x-2">
            <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/my/saved-jobs(page=${p})}"
               th:class="${p == currentPage ? 'w-10 h-10 flex items-center justify-center rounded-xl bg-teal-600 text-white font-bold' : 'w-10 h-10 flex items-center justify-center rounded-xl bg-white text-gray-600 border border-gray-200 hover:border-teal-400 hover:text-teal-600'} + ' transition text-sm'"
               th:text="${p + 1}">
                1
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
