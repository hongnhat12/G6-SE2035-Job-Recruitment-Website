<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Industry Form')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="col-span-1">
            <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
                <div class="bg-teal-600 text-white py-4 px-6">
                    <h3 class="font-bold flex items-center text-sm">
                        <i class="fa-solid fa-gauge mr-2"></i> Admin Control
                    </h3>
                </div>
                <div class="divide-y divide-gray-50">
                    <a th:href="@{/admin/dashboard}" class="block py-4 px-6 text-sm font-medium text-gray-700 hover:bg-gray-50 flex items-center transition">
                        <i class="fa-solid fa-chart-pie mr-3 text-gray-400"></i> Dashboard
                    </a>
                    <a th:href="@{/admin/companies}" class="block py-4 px-6 text-sm font-medium text-gray-700 hover:bg-gray-50 flex items-center transition">
                        <i class="fa-solid fa-building mr-3 text-gray-400"></i> Companies
                    </a>
                    <a th:href="@{/admin/industries}" class="block py-4 px-6 text-sm font-bold text-teal-600 bg-teal-50 flex items-center">
                        <i class="fa-solid fa-tags mr-3 text-teal-600"></i> Industries
                    </a>
                    <a th:href="@{/admin/jobs/pending}" class="block py-4 px-6 text-sm font-medium text-gray-700 hover:bg-gray-50 flex items-center transition">
                        <i class="fa-solid fa-circle-check mr-3 text-gray-400"></i> Job Approvals
                    </a>
                </div>
            </div>
        </aside>

        <div class="col-span-1 lg:col-span-3 space-y-6">
            <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
                <div class="border-b border-gray-100 py-6 px-8 flex items-center gap-4">
                    <a th:href="@{/admin/industries}" class="border border-gray-200 hover:border-teal-500 hover:text-teal-600 text-gray-500 rounded-xl p-2.5 transition">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </a>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900" th:text="${industry.industryId == null ? 'Create New Industry' : 'Edit Industry Details'}">Industry Details</h1>
                        <p class="text-sm text-gray-500 mt-1">Specify the category properties</p>
                    </div>
                </div>

                <div class="p-8">
                    <form th:action="@{/admin/industries/save}" th:object="${industry}" method="POST" class="space-y-6" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:field="*{industryId}">

                        <div th:if="${errorMessage}" class="flex items-center bg-red-50 border-l-4 border-red-500 p-4 text-red-700 rounded-xl text-sm gap-2">
                            <i class="fa-solid fa-triangle-exclamation flex-shrink-0"></i>
                            <span th:text="${errorMessage}">Error message</span>
                        </div>

                        <div>
                            <label for="industryName" class="block text-sm font-bold text-gray-700 mb-2">Industry Name <span class="text-red-500">*</span></label>
                            <input type="text" id="industryName" th:field="*{industryName}" placeholder="e.g. Information Technology"
                                   th:class="${nameError != null ? 'border-red-500 focus:ring-red-500 focus:border-red-500' : 'border-gray-200 focus:ring-teal-500 focus:border-teal-500'} + ' w-full px-4 py-3 border rounded-xl focus:ring-2 focus:outline-none transition shadow-sm text-sm'">
                            <p th:if="${nameError}" class="text-xs text-red-600 mt-1 font-medium">
                                <i class="fa-solid fa-circle-exclamation mr-1"></i><span th:text="${nameError}"></span>
                            </p>
                        </div>

                        <div>
                            <label for="description" class="block text-sm font-bold text-gray-700 mb-2">Description</label>
                            <textarea id="description" th:field="*{description}" rows="5" placeholder="Brief description of the industry sector..." 
                                      class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none transition shadow-sm text-sm"></textarea>
                        </div>

                        <div class="flex justify-end gap-3 pt-6 border-t border-gray-100">
                            <a th:href="@{/admin/industries}" class="px-6 py-2.5 text-sm font-bold text-gray-500 hover:text-gray-700 mt-1.5 transition">Cancel</a>
                            <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 px-6 rounded-xl transition shadow-lg text-sm">
                                Save Industry
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
