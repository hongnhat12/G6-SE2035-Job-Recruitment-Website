<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ═══════════════════════════════════════════════
     HEAD
═══════════════════════════════════════════════ -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — JobHub'">JobHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<!-- ═══════════════════════════════════════════════
     NAVBAR
═══════════════════════════════════════════════ -->
<header th:fragment="navbar">
<nav class="navbar navbar-expand-lg bg-white sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <i class="fa-solid fa-briefcase"></i>JobHub
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link px-3 rounded-2" th:href="@{/}">
                        <i class="fa-solid fa-house me-1 fa-sm"></i>Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 rounded-2" th:href="@{/jobs}">
                        <i class="fa-solid fa-magnifying-glass me-1 fa-sm"></i>Find Jobs
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
                <!-- Guest -->
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}" class="btn btn-primary btn-sm px-4 fw-semibold">
                        <i class="fa-solid fa-right-to-bracket me-1"></i>Login
                    </a>
                </div>

                <!-- Authenticated candidate -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <a th:href="@{/my/saved-jobs}"
                       class="btn btn-sm btn-light fw-medium">
                        <i class="fa-regular fa-bookmark me-1"></i>Saved Jobs
                    </a>
                    <a th:href="@{/my/applications}"
                       class="btn btn-sm btn-light fw-medium">
                        <i class="fa-regular fa-file-lines me-1"></i>My Applications
                    </a>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger fw-medium">
                            <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</header>

<!-- ═══════════════════════════════════════════════
     FLASH MESSAGES
═══════════════════════════════════════════════ -->
<div th:fragment="flash">
    <div th:if="${success}"
         class="flash-toast alert alert-success alert-dismissible d-flex align-items-center mb-0">
        <i class="fa-solid fa-circle-check me-2 fs-5"></i>
        <span th:text="${success}" class="fw-medium"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}"
         class="flash-toast alert alert-danger alert-dismissible d-flex align-items-center mb-0">
        <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
        <span th:text="${error}" class="fw-medium"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ═══════════════════════════════════════════════
     FOOTER
═══════════════════════════════════════════════ -->
<footer th:fragment="footer" class="bg-white border-top mt-auto py-4">
    <div class="container">
        <div class="row align-items-center g-2">
            <div class="col-md-6">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <i class="fa-solid fa-briefcase text-primary"></i>
                    <span class="fw-bold">JobHub</span>
                </div>
                <p class="small text-muted mb-0">Job Recruitment Platform · SE2035 – Group 6</p>
            </div>
            <div class="col-md-6 text-md-end">
                <p class="small text-muted mb-0">© 2025 JobHub. All rights reserved.</p>
            </div>
        </div>
    </div>
</footer>

</html>
