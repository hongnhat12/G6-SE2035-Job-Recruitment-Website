<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reset Password')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="flex-grow flex items-center justify-center py-20 px-4 bg-gray-50">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        <div class="p-8">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Reset Password</h2>
                <p class="text-gray-500">Create a new password for your account</p>
            </div>

            <div th:if="${error}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 text-red-700 text-sm">
                <span th:text="${error}"></span>
            </div>

            <form th:if="${token}" th:action="@{/reset-password}" method="POST" class="space-y-6">
                <input type="hidden" name="token" th:value="${token}">

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">New password</label>
                    <input type="password" name="password" required minlength="6" class="block w-full px-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition sm:text-sm" placeholder="At least 6 characters">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm password</label>
                    <input type="password" name="confirmPassword" required minlength="6" class="block w-full px-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition sm:text-sm" placeholder="Re-enter new password">
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition">
                    Reset Password
                </button>
            </form>

            <div class="mt-8 text-center">
                <a th:href="@{/login}" class="font-bold text-teal-600 hover:text-teal-500 text-sm">Back to login</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
