<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Jobs')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments :: navbar}"></nav>
<div> th:replace="~{fragments :: flash}"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900">Manage Job Postings</h1>
                <p class="text-gray-500">You have <span class="font-bold text-teal-600" th:text="${jobs.size()}">0</span> job postings</p>
            </div>
            <a th:href="@{/jobs/create}" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Post New Job
            </a>
        </div>

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Job Title</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Salary</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Posted Date</th>
                    <th class="px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-100">
                <tr th:each="job : ${jobs}" class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-bold text-gray-900" th:text="${job.title}">Job Title</div>
                        <div class="text-xs text-gray-500" th:text="${(job.industry != null ? job.industry.industryName : 'Unknown') + ' • ' + job.employmentType}">Industry • Type</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700"
                        th:text="${(job.salaryMin != null ? (job.salaryMin.longValue() / 1000) : '0') + ' - ' + (job.salaryMax != null ? (job.salaryMax.longValue() / 1000) : '0') + 'k'}">
                        Salary
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(job.createdAt, 'dd/MM/yyyy')}">
                        Date
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <span th:switch="${job.status.name()}" class="inline-flex">
                            <span th:case="'APPROVED'" class="bg-green-50 text-green-700 border border-green-200 px-2.5 py-1 text-xs font-bold rounded-lg">Active</span>
                            <span th:case="'PENDING'" class="bg-yellow-50 text-yellow-700 border border-yellow-200 px-2.5 py-1 text-xs font-bold rounded-lg">Pending</span>
                            <span th:case="'CLOSED'" class="bg-gray-50 text-gray-600 border border-gray-200 px-2.5 py-1 text-xs font-bold rounded-lg">Closed</span>
                            <span th:case="'REJECTED'" class="bg-red-50 text-red-700 border border-red-200 px-2.5 py-1 text-xs font-bold rounded-lg">Rejected</span>
                            <span th:case="*" class="bg-gray-50 text-gray-600 border border-gray-200 px-2.5 py-1 text-xs font-bold rounded-lg" th:text="${job.status.name()}">Status</span>
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium space-x-3">
                        <a th:href="@{/jobs/edit/{id}(id=${job.jobId})}" class="text-teal-600 hover:text-teal-900">Edit</a>

                        <form th:if="${job.status.name() == 'APPROVED' or job.status.name() == 'PENDING'}" th:action="@{/jobs/close/{id}(id=${job.jobId})}" method="POST" class="inline" onsubmit="return confirm('Are you sure you want to close this job posting?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="text-yellow-600 hover:text-yellow-800">Close</button>
                        </form>

                        <form th:action="@{/jobs/delete/{id}(id=${job.jobId})}" method="POST" class="inline" onsubmit="return confirm('Are you sure you want to delete this job posting?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="text-red-600 hover:text-red-900">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${jobs == null or jobs.isEmpty()}">
                    <td colspan="5" class="px-6 py-12 text-center text-gray-400 text-sm">You have not posted any jobs yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
