<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Manage Applications')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <div class="col-span-1" th:replace="~{fragments/recruiter-sidebar :: sidebar}"></div>
        <div class="col-span-1 lg:col-span-3 space-y-8">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-8">Manage Candidate Applications</h1>

            <div th:if="${applications == null or applications.isEmpty()}" class="text-center py-24 text-gray-500 bg-white rounded-2xl border border-gray-100">
                <p class="text-xl font-semibold">No candidates have applied yet.</p>
            </div>
            <div th:unless="${applications == null or applications.isEmpty()}">
                <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Candidate</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Position</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Date Applied</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Resume</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Status</th>
                                <th class="px-6 py-4 text-right text-xs font-bold text-gray-500 uppercase">Actions</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white">
                            <tr th:each="app : ${applications}" class="hover:bg-gray-50">
                                <td class="px-6 py-4">
                                    <div class="font-bold text-gray-900" th:text="${app.candidate.fullName}">Name</div>
                                    <div class="text-xs text-gray-500" th:text="${app.candidate.user.email}">Email</div>
                                    <div class="text-xs text-gray-400" th:text="${app.candidate.phone}">Phone</div>
                                </td>
                                <td class="px-6 py-4 text-sm font-semibold text-gray-700" th:text="${app.job.title}">Job Title</td>
                                <td class="px-6 py-4 text-sm text-gray-500" th:text="${#temporals.format(app.appliedAt, 'dd/MM/yyyy')}">Date</td>
                                <td class="px-6 py-4">
                                    <a th:if="${app.cv != null}" th:href="${app.cv.filePath}" target="_blank" class="text-teal-600 hover:underline text-sm">View Resume ↗</a>
                                    <span th:unless="${app.cv != null}" class="text-gray-400 text-xs">No Resume</span>
                                </td>
                                <td class="px-6 py-4">
                                <span th:switch="${app.status.name()}" class="px-3 py-1 text-xs font-bold rounded-full">
                                    <span th:case="'PENDING'" class="bg-gray-100 text-gray-600">Pending</span>
                                    <span th:case="'SHORTLISTED'" class="bg-yellow-100 text-yellow-700">Shortlisted</span>
                                    <span th:case="'HIRED'" class="bg-green-100 text-green-700">Hired</span>
                                    <span th:case="'REJECTED'" class="bg-red-100 text-red-700">Rejected</span>
                                    <span th:case="'WITHDRAWN'" class="bg-gray-100 text-gray-400">Withdrawn</span>
                                </span>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <div class="flex justify-end items-center space-x-2" th:if="${app.status.name() != 'WITHDRAWN'}">
                                        <form th:action="@{/recruiter/applications/status}" method="POST" class="flex space-x-2" onsubmit="if(this.submitted) return false; this.submitted = true;">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <input type="hidden" name="applicationId" th:value="${app.applicationId}">
                                            <button name="status" value="SHORTLISTED" class="text-xs bg-yellow-50 text-yellow-700 font-bold px-3 py-2 rounded-lg hover:bg-yellow-100 transition">Review</button>
                                            <button name="status" value="HIRED" class="text-xs bg-green-50 text-green-700 font-bold px-3 py-2 rounded-lg hover:bg-green-100 transition">Hire</button>
                                            <button name="status" value="REJECTED" class="text-xs bg-red-50 text-red-700 font-bold px-3 py-2 rounded-lg hover:bg-red-100 transition">Reject</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
