<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Search Jobs')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>

<main class="flex-grow">
    <div class="bg-gradient-to-br from-teal-600 to-teal-800 py-14">
        <div class="max-w-7xl mx-auto px-4">
            <h1 class="text-4xl font-extrabold text-white mb-6 text-center">Search Jobs</h1>
            
            <form th:action="@{/jobs}" method="GET" class="max-w-4xl mx-auto bg-white p-3 rounded-2xl shadow-2xl flex gap-3">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Position, skills, company..." class="flex-grow px-4 py-3 focus:outline-none text-gray-800 text-sm">
                <select name="location" class="px-4 py-3 border-l border-gray-100 bg-white text-gray-700 text-sm focus:outline-none">
                    <option value="">All Locations</option>
                    <option th:each="loc : ${locations}" th:value="${loc}" th:text="${loc}" th:selected="${loc == location}"></option>
                </select>
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-8 py-3 rounded-xl transition">Search</button>
            </form>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Filter Sidebar -->
            <aside class="lg:w-72 flex-shrink-0">
                <form th:action="@{/jobs}" method="GET" class="space-y-6 bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <h3 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-3">Search Filters</h3>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-3">Industry</label>
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            <label class="flex items-center gap-2 cursor-pointer select-none py-1 px-2 rounded-lg hover:bg-teal-50 transition">
                                <input type="radio" name="industry" value="" th:checked="${industry == null or industry.isEmpty()}" class="text-teal-600"> <span class="text-sm">All</span>
                            </label>
                            <label th:each="ind : ${industries}" class="flex items-center gap-2 cursor-pointer select-none py-1 px-2 rounded-lg hover:bg-teal-50 transition">
                                <input type="radio" name="industry" th:value="${ind}" th:checked="${ind == industry}" class="text-teal-600"> <span class="text-sm" th:text="${ind}">Industry</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-3">Employment Type</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2 cursor-pointer select-none py-1 px-2 rounded-lg hover:bg-teal-50 transition">
                                <input type="radio" name="employmentType" value="" th:checked="${employmentType == null or employmentType.isEmpty()}" class="text-teal-600"> <span class="text-sm">All</span>
                            </label>
                            <label th:each="type : ${employmentTypes}" class="flex items-center gap-2 cursor-pointer select-none py-1 px-2 rounded-lg hover:bg-teal-50 transition">
                                <input type="radio" name="employmentType" th:value="${type}" th:checked="${type == employmentType}" class="text-teal-600">
                                <span class="text-sm" th:text="${type}">Type</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Location</label>
                        <select name="location" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-teal-500">
                            <option value="">All Locations</option>
                            <option th:each="loc : ${locations}" th:value="${loc}" th:text="${loc}" th:selected="${loc == location}"></option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-teal-600 text-white font-bold py-3 rounded-xl hover:bg-teal-700 transition">Apply Filters</button>
                    <a th:href="@{/jobs}" class="block text-center text-sm text-gray-500 hover:text-teal-600 transition">Clear Filters</a>
                </form>
            </aside>

            <!-- Results -->
            <div class="flex-grow">
                <div class="flex justify-between items-center mb-6">
                    <p class="text-gray-600">Found <strong class="text-teal-600" th:text="${totalElements}">0</strong> matching jobs</p>
                </div>

                <div th:if="${jobs.empty}" class="text-center py-24 bg-white rounded-2xl border border-gray-100">
                    <svg class="w-24 h-24 mx-auto text-gray-200 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <p class="text-xl font-semibold text-gray-500">No matching results found.</p>
                </div>

                <div th:unless="${jobs.empty}" class="space-y-4">
                    <div th:each="job : ${jobs.content}" class="bg-white border border-gray-100 rounded-2xl p-6 hover:shadow-lg transition group">
                        <div class="flex items-start gap-5">
                            <div class="w-16 h-16 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center p-2 flex-shrink-0">
                                <img th:src="${job.company != null and job.company.logo != null ? job.company.logo : 'https://via.placeholder.com/100'}" alt="logo" class="max-w-full max-h-full object-contain">
                            </div>
                            <div class="flex-grow">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="text-lg font-bold text-gray-900 group-hover:text-teal-600 transition">
                                            <a th:href="@{/jobs/{id}(id=${job.jobId})}" th:text="${job.title}">Job Title</a>
                                        </h3>
                                        <p class="text-teal-600 font-semibold text-sm" th:text="${job.company?.companyName}">Company</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-green-600 font-bold" th:text="${(job.salaryMin != null ? (job.salaryMin.longValue() / 1000) : '0') + ' - ' + (job.salaryMax != null ? (job.salaryMax.longValue() / 1000) : '0') + 'k'}">
                                            Salary
                                        </p>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-2 mt-3">
                                    <span class="bg-gray-50 text-gray-600 text-xs px-3 py-1 rounded-lg" th:text="${job.location}">Location</span>
                                    <span class="bg-teal-50 text-teal-600 text-xs font-bold px-3 py-1 rounded-lg uppercase" th:text="${job.employmentType}">Type</span>
                                    <span th:if="${job.industry != null}" class="bg-purple-50 text-purple-600 text-xs px-3 py-1 rounded-lg" th:text="${job.industry?.industryName}">Industry</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${totalPages > 1}" class="flex justify-center mt-10 space-x-2">
                    <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                       th:href="@{/jobs(keyword=${keyword},industry=${industry},location=${location},employmentType=${employmentType},page=${p})}"
                       th:class="${p == currentPage ? 'w-10 h-10 flex items-center justify-center rounded-xl bg-teal-600 text-white font-bold' : 'w-10 h-10 flex items-center justify-center rounded-xl bg-white text-gray-600 border border-gray-200 hover:border-teal-400 hover:text-teal-600'} + ' transition text-sm'"
                       th:text="${p + 1}">
                        1
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
