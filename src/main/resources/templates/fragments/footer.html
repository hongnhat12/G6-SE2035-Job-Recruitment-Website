<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<footer th:fragment="footer" class="bg-gray-900 text-white py-12 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <div class="col-span-1 md:col-span-2">
                <div class="flex items-center mb-4">
                    <svg class="w-8 h-8 mr-2 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    </svg>
                    <span class="text-2xl font-bold">D reamJob</span>
                </div>

                </p>
            </div>
            <div>
                <h4 class="text-lg font-semibold mb-4">For Candidates</h4>
                <ul class="space-y-2 text-gray-400">
                    <li><a th:href="@{/jobs}" class="hover:text-teal-500 transition">Search Jobs</a></li>
                    <li><a th:href="@{/my/saved-jobs}" class="hover:text-teal-500 transition">Saved Jobs</a></li>
                    <li><a th:href="@{/my/applications}" class="hover:text-teal-500 transition">My Applications</a></li>
                </ul>
            </div>
            <div>

                <ul class="space-y-2 text-gray-400">
                    <li><a th:href="@{/recruiter/jobs/create}" class="hover:text-teal-500 transition">Post a Job</a></li>
                    <li><a th:href="@{/recruiter/jobs}" class="hover:text-teal-500 transition">Manage Jobs</a></li>
                    <li><a th:href="@{/recruiter/applications}" class="hover:text-teal-500 transition">Manage Applications</a></li>
                </ul>
            </div>
        </div>
        <div class="border-t border-gray-800 mt-12 pt-8 text-center text-gray-500 text-sm">
