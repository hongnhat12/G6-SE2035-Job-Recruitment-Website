<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="navbar" class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center">
                <a th:href="@{/}" class="text-2xl font-bold text-teal-600 flex items-center">
                    <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    DreamJob
                </a>
            </div>

            <div class="hidden md:flex items-center space-x-8">
                <a sec:authorize="!hasRole('ADMIN') && !hasRole('RECRUITER')" th:href="@{/}" class="text-gray-600 hover:text-teal-600 font-medium transition">Home</a>
                <a sec:authorize="!hasRole('ADMIN') && !hasRole('RECRUITER')" th:href="@{/jobs}" class="text-gray-600 hover:text-teal-600 font-medium transition">Search Jobs</a>
                <div sec:authorize="hasRole('RECRUITER')" class="flex space-x-8">
                </div>
                <div sec:authorize="hasRole('CANDIDATE')" class="flex space-x-8">
                    <a th:href="@{/my/saved-jobs}" class="text-gray-600 hover:text-teal-600 font-medium transition">Saved Jobs</a>
                    <a th:href="@{/my/applications}" class="text-gray-600 hover:text-teal-600 font-medium transition">My Applications</a>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <div sec:authorize="isAuthenticated()" class="relative group">
                    <div class="flex items-center space-x-2 text-gray-700 hover:text-teal-600 focus:outline-none cursor-pointer">
                        <span class="font-medium hidden sm:block" th:text="${fullName != null ? fullName : #authentication.name}">User</span>
                        <img th:if="${profileImage != null}" th:src="${profileImage}" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-gray-200 bg-white">
                        <div th:unless="${profileImage != null}" class="w-9 h-9 rounded-full bg-teal-600 flex items-center justify-center text-white font-bold text-sm">
                            <span th:text="${fullName != null ? fullName.substring(0,1).toUpperCase() : #authentication.name.substring(0,1).toUpperCase()}">U</span>
                        </div>
                    </div>
                    <div class="absolute right-0 w-52 bg-white rounded-xl shadow-xl py-2 border border-gray-100 hidden group-hover:block z-50">
                        <div class="px-4 py-2 border-b border-gray-50">
                            <p class="text-sm font-bold text-gray-900" th:text="${fullName}">Name</p>
                            <p class="text-xs text-gray-500" th:text="${userRole}">Role</p>
                        </div>
                        <a sec:authorize="!hasRole('ADMIN')" th:href="@{/profile}" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50">My Profile</a>
                        <div sec:authorize="hasRole('CANDIDATE')">
                            <a th:href="@{/my/applications}" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50">Applications</a>
                            <a th:href="@{/my/saved-jobs}" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50">Saved Jobs</a>
                        </div>
                        <div sec:authorize="hasRole('RECRUITER')">
                            <a th:href="@{/recruiter/dashboard}" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50">Dashboard</a>
                        </div>

                        <div class="border-t border-gray-50 my-1"></div>
                        <form th:action="@{/logout}" method="POST" class="block w-full">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50">Log Out</button>
                        </form>
                    </div>
                </div>

                <div sec:authorize="!isAuthenticated()" class="flex space-x-4">
                    <a th:href="@{/login}" class="text-gray-600 hover:text-teal-600 font-medium self-center">Log In</a>
                    <a th:href="@{/register}" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-lg font-medium transition shadow-sm">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</nav>
</html>
