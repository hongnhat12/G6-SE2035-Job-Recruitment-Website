<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Applications')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-8">My Applications</h1>

    <div th:if="${applications.empty}" class="text-center py-24 bg-white rounded-2xl border border-gray-100">
        <svg class="w-24 h-24 mx-auto text-gray-200 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <p class="text-xl font-semibold text-gray-500">You have not applied for any jobs.</p>
        <a th:href="@{/jobs}" class="mt-6 inline-block bg-teal-600 text-white font-bold px-8 py-3 rounded-xl hover:bg-teal-700 transition">Explore Jobs</a>
    </div>

    <div th:unless="${applications.empty}">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="app : ${applications.content}" class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-lg transition flex flex-col justify-between">
                <div>
                    <div class="flex items-center mb-4">
                        <div class="w-14 h-14 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center mr-4 p-2 flex-shrink-0">
                            <img th:src="${app.job.company != null and app.job.company.logo != null ? app.job.company.logo : 'https://via.placeholder.com/100'}" alt="logo" class="max-w-full max-h-full object-contain">
                        </div>
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-gray-900 truncate" th:text="${app.job.title}">Job Title</h3>
                            <p class="text-sm text-teal-600 truncate" th:text="${app.job.company?.companyName}">Company</p>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-50">
                        <span class="text-xs text-gray-400">Applied <span th:text="${#temporals.format(app.appliedAt, 'dd/MM/yyyy')}">Date</span></span>
                        
                        <span th:switch="${app.status.name()}" class="px-3 py-1 text-xs font-bold rounded-full">
                            <span th:case="'PENDING'" class="bg-gray-100 text-gray-600">Pending</span>
                            <span th:case="'SHORTLISTED'" class="bg-yellow-100 text-yellow-700">Shortlisted</span>
                            <span th:case="'HIRED'" class="bg-green-100 text-green-700">Hired</span>
                            <span th:case="'REJECTED'" class="bg-red-100 text-red-700">Rejected</span>
                            <span th:case="'WITHDRAWN'" class="bg-gray-100 text-gray-400">Withdrawn</span>
                        </span>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t border-gray-50 flex items-center justify-between">
                    <a th:if="${app.cv != null}" th:href="${app.cv.filePath}" target="_blank" class="text-xs text-teal-500 hover:underline">View Resume ↗</a>
                    
                    <!-- Withdraw application -->
                    <form th:if="${app.status.name() == 'PENDING'}" th:action="@{/my/applications/{id}/withdraw(id=${app.applicationId})}" method="POST" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="text-xs text-red-500 hover:text-red-700 border border-red-200 hover:border-red-400 py-1 px-3 rounded-lg transition"
                                onclick="return confirm('Are you sure you want to withdraw this application?')">Withdraw</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="flex justify-center mt-10 space-x-2">
            <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/my/applications(page=${p})}"
               th:class="${p == currentPage ? 'w-10 h-10 flex items-center justify-center rounded-xl bg-teal-600 text-white font-bold' : 'w-10 h-10 flex items-center justify-center rounded-xl bg-white text-gray-600 border border-gray-200 hover:border-teal-400 hover:text-teal-600'} + ' transition text-sm'"
               th:text="${p + 1}">
                1
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
