<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('My Applications')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container py-5">

    <!-- ═══ PAGE HEADER ════════════════════════════════════ -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-5">
        <div>
            <h1 class="section-title mb-1">
                <i class="fa-solid fa-file-lines text-primary me-2"></i>My Applications
            </h1>
            <p class="text-muted mb-0">
                Total
                <strong th:text="${applications.totalElements}">0</strong> applications
            </p>
        </div>
        <a th:href="@{/jobs}" class="btn btn-primary fw-semibold px-4">
            <i class="fa-solid fa-magnifying-glass me-2"></i>Find New Jobs
        </a>
    </div>

    <!-- ═══ STATUS LEGEND ══════════════════════════════════ -->
    <div th:unless="${applications.empty}"
         class="bg-white border rounded-3 p-3 mb-4 d-flex flex-wrap gap-3 align-items-center shadow-sm">
        <span class="small text-muted fw-medium me-1">Status:</span>
        <span class="status-badge status-PENDING">
            <i class="fa-solid fa-clock"></i> Pending
        </span>
        <span class="status-badge status-SHORTLISTED">
            <i class="fa-solid fa-user-check"></i> Shortlisted
        </span>
        <span class="status-badge status-HIRED">
            <i class="fa-solid fa-circle-check"></i> Hired
        </span>
        <span class="status-badge status-REJECTED">
            <i class="fa-solid fa-circle-xmark"></i> Rejected
        </span>
        <span class="status-badge status-WITHDRAWN">
            <i class="fa-solid fa-ban"></i> Withdrawn
        </span>
    </div>

    <!-- ═══ EMPTY STATE ═════════════════════════════════════ -->
    <div th:if="${applications.empty}"
         class="empty-state bg-white rounded-4 border shadow-sm">
        <div class="empty-icon"><i class="fa-solid fa-file-circle-xmark"></i></div>
        <h5 class="fw-bold mt-2">No applications yet</h5>
        <p class="text-muted">Explore and apply for positions that match your profile</p>
        <a th:href="@{/jobs}" class="btn btn-primary px-5 fw-semibold">
            <i class="fa-solid fa-magnifying-glass me-2"></i>Explore Jobs
        </a>
    </div>

    <!-- ═══ APPLICATION LIST ════════════════════════════════ -->
    <div class="d-flex flex-column gap-3" th:unless="${applications.empty}">
        <div th:each="app : ${applications.content}"
             class="bg-white border rounded-4 p-4 shadow-sm">
            <div class="row align-items-center g-3">

                <!-- Company avatar -->
                <div class="col-auto">
                    <div class="company-avatar">
                        <i class="fa-solid fa-building"></i>
                    </div>
                </div>

                <!-- Job info -->
                <div class="col min-w-0">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
                        <div class="min-w-0">
                            <a th:href="@{/jobs/{id}(id=${app.job.jobId})}"
                               class="text-decoration-none">
                                <h5 class="fw-semibold text-dark mb-1 hover-primary"
                                    th:text="${app.job.title}">Job Title</h5>
                            </a>
                            <p class="text-muted small mb-2"
                               th:text="${app.job.company?.companyName}">Company</p>
                            <div class="d-flex flex-wrap gap-2">
                                <span th:if="${app.job.location}" class="pill-tag">
                                    <i class="fa-solid fa-location-dot me-1"></i>
                                    <span th:text="${app.job.location}"></span>
                                </span>
                                <span class="pill-tag">
                                    <i class="fa-regular fa-clock me-1"></i>
                                    Applied: <span th:text="${#temporals.format(app.appliedAt,'dd/MM/yyyy HH:mm')}"></span>
                                </span>
                                <span th:if="${app.cv != null}" class="pill-tag">
                                    <i class="fa-solid fa-file-pdf me-1 text-danger"></i>
                                    <span th:text="${app.cv.cvName}">CV</span>
                                </span>
                            </div>
                        </div>

                        <!-- Status + withdraw -->
                        <div class="text-end flex-shrink-0">
                            <!-- Status badge -->
                            <div class="mb-3">
                                <span th:switch="${app.status.name()}"
                                      th:class="${'status-badge status-' + app.status.name()}">
                                    <!-- PENDING -->
                                    <th:block th:case="'PENDING'">
                                        <i class="fa-solid fa-clock"></i> Pending
                                    </th:block>
                                    <!-- SHORTLISTED -->
                                    <th:block th:case="'SHORTLISTED'">
                                        <i class="fa-solid fa-user-check"></i> Shortlisted
                                    </th:block>
                                    <!-- HIRED -->
                                    <th:block th:case="'HIRED'">
                                        <i class="fa-solid fa-circle-check"></i> Hired
                                    </th:block>
                                    <!-- REJECTED -->
                                    <th:block th:case="'REJECTED'">
                                        <i class="fa-solid fa-circle-xmark"></i> Rejected
                                    </th:block>
                                    <!-- WITHDRAWN -->
                                    <th:block th:case="'WITHDRAWN'">
                                        <i class="fa-solid fa-ban"></i> Withdrawn
                                    </th:block>
                                </span>
                            </div>

                            <!-- Withdraw button — only PENDING -->
                            <form th:if="${app.status.name() == 'PENDING'}"
                                  th:action="@{/my/applications/{id}/withdraw(id=${app.applicationId})}"
                                  method="post">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <button type="submit"
                                        class="btn btn-outline-danger btn-sm fw-medium px-3"
                                        onclick="return confirm('Are you sure you want to withdraw this application?')">
                                    <i class="fa-solid fa-rotate-left me-1"></i>Withdraw
                                </button>
                            </form>

                            <!-- View job -->
                            <a th:href="@{/jobs/{id}(id=${app.job.jobId})}"
                               class="btn btn-light btn-sm fw-medium px-3 mt-2 d-block">
                                <i class="fa-solid fa-eye me-1"></i>View Job
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Progress bar for active applications -->
            <div th:if="${app.status.name() == 'PENDING' or app.status.name() == 'SHORTLISTED'}"
                 class="mt-3 pt-3 border-top">
                <div class="d-flex justify-content-between small text-muted mb-1">
                    <span>Review Progress</span>
                    <span th:text="${app.status.name() == 'PENDING' ? 'Step 1/3' : 'Step 2/3'}"></span>
                </div>
                <div class="progress" style="height:6px;border-radius:10px">
                    <div class="progress-bar bg-primary"
                         th:style="${'width:' + (app.status.name() == 'PENDING' ? '33' : '66') + '%'}">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ PAGINATION ══════════════════════════════════════ -->
    <nav th:if="${totalPages > 1}" aria-label="Pagination" class="mt-4">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/my/applications(page=${currentPage-1})}">
                    <i class="fa-solid fa-chevron-left fa-xs"></i>
                </a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                class="page-item" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:text="${i+1}"
                   th:href="@{/my/applications(page=${i})}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                <a class="page-link" th:href="@{/my/applications(page=${currentPage+1})}">
                    <i class="fa-solid fa-chevron-right fa-xs"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => document.querySelectorAll('.flash-toast').forEach(el =>
        bootstrap.Alert.getOrCreateInstance(el).close()), 4000);
</script>
</body>
</html>
