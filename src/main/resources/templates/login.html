<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body class="d-flex flex-column min-vh-100" style="background:var(--slate-100)">

<div th:replace="~{fragments :: navbar}"></div>

<div class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-9 col-md-6 col-lg-4">

                <!-- Logo + heading -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center
                                bg-primary text-white rounded-circle mb-3 shadow"
                         style="width:64px;height:64px;font-size:1.6rem">
                        <i class="fa-solid fa-briefcase"></i>
                    </div>
                    <h2 class="fw-bold mb-1" style="letter-spacing:-0.5px">Welcome Back</h2>
                    <p class="text-muted">Login to continue your career journey</p>
                </div>

                <!-- Card -->
                <div class="bg-white rounded-4 shadow-sm p-4">

                    <!-- Alerts -->
                    <div th:if="${param.error}"
                         class="alert alert-danger d-flex align-items-center gap-2 py-2 small mb-3">
                        <i class="fa-solid fa-triangle-exclamation flex-shrink-0"></i>
                        <span>Incorrect email or password. Please try again.</span>
                    </div>
                    <div th:if="${param.logout}"
                         class="alert alert-success d-flex align-items-center gap-2 py-2 small mb-3">
                        <i class="fa-solid fa-circle-check flex-shrink-0"></i>
                        <span>Logged out successfully!</span>
                    </div>

                    <form th:action="@{/login}" method="post" novalidate>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">
                                Email address <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="fa-regular fa-envelope fa-sm"></i>
                                </span>
                                <input type="email" id="email" name="username"
                                       class="form-control border-start-0"
                                       placeholder="email@example.com"
                                       autocomplete="email" required autofocus>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label small fw-semibold">
                                Password <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="fa-solid fa-lock fa-sm"></i>
                                </span>
                                <input type="password" id="password" name="password"
                                       class="form-control border-start-0 border-end-0"
                                       placeholder="Enter your password"
                                       autocomplete="current-password" required>
                                <button type="button"
                                        class="input-group-text bg-light border-start-0 text-muted"
                                        id="togglePwd" title="Show/hide password">
                                    <i class="fa-regular fa-eye fa-sm"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Login
                        </button>
                    </form>
                </div>

                <!-- Test account hint -->
                <div class="mt-4 bg-white border rounded-3 p-3 shadow-sm">
                    <p class="small fw-semibold text-muted mb-2">
                        <i class="fa-solid fa-circle-info text-primary me-1"></i>
                        Test account (SE2035 – Group 6)
                    </p>
                    <div class="d-flex flex-column gap-1 small text-muted">
                        <div><span class="fw-medium text-dark">Candidate:</span> candidate1@example.com</div>
                        <div><span class="fw-medium text-dark">Password:</span> Password@123</div>
                    </div>
                </div>

                <p class="text-center text-muted small mt-4">
                    <a th:href="@{/}" class="text-decoration-none text-muted hover-primary">
                        <i class="fa-solid fa-arrow-left me-1"></i>Back to Home
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const pwd = document.getElementById('password');
    const icon = document.querySelector('#togglePwd i');
    document.getElementById('togglePwd').addEventListener('click', () => {
        const isHidden = pwd.type === 'password';
        pwd.type = isHidden ? 'text' : 'password';
        icon.className = isHidden ? 'fa-regular fa-eye-slash fa-sm' : 'fa-regular fa-eye fa-sm';
    });
</script>
</body>
</html>
