<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Sign Up')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>

<main class="flex-grow flex items-center justify-center py-20 px-4 bg-gray-50">
    <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        <div class="p-8">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Create a New Account</h2>
                <p class="text-gray-500">Begin your career journey today</p>
            </div>

            <div th:if="${error}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 text-red-700 text-sm flex items-center">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span th:text="${error}">Error message</span>
            </div>

            <form th:action="@{/register}" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                        <input type="text" name="fullName" required class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 transition sm:text-sm" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                        <input type="tel" name="phone" required
                               pattern="\d{10}" maxlength="10"
                               class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 transition sm:text-sm"
                               placeholder="0901234567"
                               title="Phone number must be exactly 10 digits"
                               oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Professional Email</label>
                    <input type="email" name="email" required class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 transition sm:text-sm" placeholder="john.doe@example.com">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 transition sm:text-sm" placeholder="Minimum 6 characters">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2 font-bold text-teal-600">You are a?</label>
                    <div class="grid grid-cols-2 gap-4 mt-2">
                        <label for="role-jobseeker" class="relative flex p-4 border rounded-xl cursor-pointer hover:bg-teal-50 transition border-gray-200 group has-[:checked]:border-teal-500 has-[:checked]:bg-teal-50">
                            <input type="radio" id="role-jobseeker" name="role" value="JOBSEEKER" checked class="mt-1 h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300">
                            <div class="ml-3">
                                <span class="block text-sm font-bold text-gray-900">Candidate</span>
                                <span class="block text-xs text-gray-500">I want to find a job</span>
                            </div>
                        </label>
                        <label for="role-recruiter" class="relative flex p-4 border rounded-xl cursor-pointer hover:bg-teal-50 transition border-gray-200 group has-[:checked]:border-teal-500 has-[:checked]:bg-teal-50">
                            <input type="radio" id="role-recruiter" name="role" value="RECRUITER" class="mt-1 h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300">
                            <div class="ml-3">
                                <span class="block text-sm font-bold text-gray-900">Recruiter</span>
                                <span class="block text-xs text-gray-500">I want to post jobs</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="text-xs text-gray-500">
                    By clicking Create Account, you agree to our <a href="#" class="text-teal-600 font-medium">Terms</a> and <a href="#" class="text-teal-600 font-medium">Privacy Policy</a>.
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition">
                    Create Account
                </button>
            </form>

            <div class="mt-8 text-center border-t border-gray-100 pt-8">
                <p class="text-sm text-gray-600">
                    Already have an account? 
                    <a th:href="@{/login}" class="font-bold text-teal-600 hover:text-teal-500">Log in here</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
