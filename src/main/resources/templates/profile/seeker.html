<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('My Profile')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow">
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
        <!-- Header Banner -->
        <div class="relative h-40 bg-gradient-to-r from-teal-500 to-teal-700 flex items-end px-10 pb-0">
            <div class="absolute -bottom-16 left-10 w-32 h-32 rounded-full border-4 border-white shadow-xl bg-teal-50 flex items-center justify-center text-5xl font-bold text-teal-600 bg-white">
                <span th:text="${profile.fullName.substring(0,1).toUpperCase()}">U</span>
            </div>
        </div>

        <form id="seekerForm"
              th:action="@{/profile/seeker/update}"
              method="POST" enctype="multipart/form-data"
              class="p-8 pt-24 space-y-8">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Original values to check deletion via JS -->
            <input type="hidden" id="orig_fullName" th:value="${profile.fullName}">
            <input type="hidden" id="orig_phone" th:value="${profile.phone}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- FullName -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Full Name *</label>
                    <input type="text" name="fullName" id="fullName"
                           th:value="${profile.fullName}" required
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
                <!-- Phone -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Phone Number *</label>
                    <input type="text" name="phone" id="phone"
                           th:value="${profile.phone}" required
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
                <!-- Headline -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Job Title / Headline</label>
                    <input type="text" name="headline" id="headline"
                           th:value="${profile.headline}"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none"
                           placeholder="e.g. Java Developer / CS Student">
                </div>
                <!-- Address -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Address</label>
                    <input type="text" name="address" id="address"
                           th:value="${profile.address}"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none"
                           placeholder="e.g. Hanoi, Vietnam">
                </div>
                <!-- CV Upload -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Upload New Resume (PDF/Word)</label>
                    <input type="file" name="cvFile" accept=".pdf,.doc,.docx"
                           class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                    <div class="mt-2 text-xs text-gray-500" th:if="${cvList != null and !cvList.empty}">
                        <p class="font-semibold text-teal-600 mb-1">Current Resumes:</p>
                        <ul class="space-y-1">
                            <li th:each="cv : ${cvList}">
                                <a th:href="${cv.filePath}" target="_blank" class="hover:underline text-teal-600 font-medium" th:text="${cv.cvName}">CV</a>
                                <span th:if="${cv.isDefault}" class="text-xs bg-teal-100 text-teal-800 px-2 py-0.5 rounded ml-1 font-bold">Default</span>
                            </li>
                        </ul>
                    </div>
                </div>
                <!-- Skills -->
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Skills (separated by commas)</label>
                    <input type="text" name="skills" id="skills"
                           th:value="${profile.skills}"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none"
                           placeholder="Java, Spring Boot, SQL, ReactJS...">
                </div>
                <!-- Summary -->
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Professional Summary</label>
                    <textarea name="summary" id="summary" rows="4"
                              class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none"
                              placeholder="Briefly describe your experience, career goals, etc..." th:text="${profile.summary}"></textarea>
                </div>
            </div>

            <div class="flex justify-end space-x-4 pt-6 border-t border-gray-100">
                <a th:href="@{/}" class="px-6 py-3 text-gray-600 font-bold hover:text-gray-900 mt-1">Cancel</a>
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-10 rounded-xl transition shadow-lg">Save Changes</button>
            </div>
        </form>
    </div>

    <!-- Password Change Section -->
    <div id="change-password" class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden mt-8">
        <div class="p-8">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-gray-900">Change Password</h3>
                    <p class="text-sm text-gray-500">Update password to secure your account</p>
                </div>
            </div>

            <form id="changePwdForm" th:action="@{/profile/change-password}" method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Current Password *</label>
                    <input type="password" name="currentPassword" id="cp_current" required
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm"
                           placeholder="Enter current password">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">New Password *</label>
                    <input type="password" name="newPassword" id="cp_new" required minlength="6"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm"
                           placeholder="Minimum 6 characters">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Confirm New Password *</label>
                    <input type="password" name="confirmPassword" id="cp_confirm" required minlength="6"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm"
                           placeholder="Confirm new password">
                    <p id="cp_matchMsg" class="text-xs mt-1 hidden"></p>
                </div>

                <div class="md:col-span-3 flex justify-end pt-2 border-t border-gray-100">
                    <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-xl transition shadow-md">
                        Change Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
(function () {
    var fields = [
        { id: 'fullName',  origId: 'orig_fullName',  label: 'Full Name' },
        { id: 'phone',     origId: 'orig_phone',     label: 'Phone Number' }
    ];

    document.getElementById('seekerForm').addEventListener('submit', function (e) {
        for (var i = 0; i < fields.length; i++) {
            var f = fields[i];
            var origEl = document.getElementById(f.origId);
            var newEl  = document.getElementById(f.id);
            if (!origEl || !newEl) continue;

            var origVal = origEl.value.trim();
            var newVal  = newEl.value.trim();

            if (origVal && !newVal) {
                e.preventDefault();
                alert(f.label + ' is already filled, deleting is not allowed!');
                newEl.focus();
                return;
            }
        }
    });

    var np = document.getElementById('cp_new');
    var cp = document.getElementById('cp_confirm');
    var msg = document.getElementById('cp_matchMsg');

    function check() {
        if (!cp.value) { msg.className = 'text-xs mt-1 hidden'; return; }
        if (np.value === cp.value) {
            msg.textContent = '✓ Passwords match';
            msg.className = 'text-xs mt-1 text-green-600';
        } else {
            msg.textContent = '✗ Passwords do not match';
            msg.className = 'text-xs mt-1 text-red-600';
        }
    }
    if (np && cp) { np.addEventListener('input', check); cp.addEventListener('input', check); }
})();
</script>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
